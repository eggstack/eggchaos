[advisories]
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    # M034: standard LLVM exception on Apache-2.0 for target-lexicon,
    # a transitive build dependency of pyo3-build-config. Permissive,
    # no copyleft effect on eggchaos crates (all MIT).
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # M059: NCSA (University of Illinois/NCSA Open Source License) for
    # libfuzzer-sys, a fuzz-only build dependency. OSI-approved and
    # FSF-free permissive license, same class as the MIT/BSD entries
    # above; no copyleft effect on eggchaos crates (all MIT).
    "NCSA",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
