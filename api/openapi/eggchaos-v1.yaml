openapi: 3.0.3
info:
  title: Eggchaos Native Control API
  version: 1.0.0
  description: >-
    Versioned native control contract for eggchaos (`/v1` JSON plus
    Prometheus-text `/metrics`). The Rust authority is the
    `eggchaos-protocol` crate; this document is mechanically drift-checked
    against that authority (operation inventory, fault discriminators,
    required fields, error envelope). Durations are integer nanoseconds
    unless a field name ends in `_ms`. Socket addresses are strings such
    as `127.0.0.1:6379`. Unknown JSON properties are rejected by the
    server.
servers:
  - url: http://127.0.0.1:8475
    description: Default loopback native admin listener.
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Service liveness and global generation
      responses:
        '200':
          description: Liveness report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthV1'
  /v1/version:
    get:
      operationId: getVersion
      summary: Service and native API version
      responses:
        '200':
          description: Version report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionV1'
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus text metrics (no /v1 prefix)
      security: []
      responses:
        '200':
          description: Prometheus exposition text.
          content:
            text/plain:
              schema:
                type: string
  /v1/reset:
    post:
      operationId: resetService
      summary: Reset stream and datagram state to configured definitions
      responses:
        '200':
          description: Reset report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetReport'
        '400':
          $ref: '#/components/responses/Invalid'
  /v1/proxies:
    get:
      operationId: listProxies
      summary: List stream proxies
      responses:
        '200':
          description: Stream proxy views.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NativeProxyViewV1'
    post:
      operationId: createProxy
      summary: Create a stream proxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeProxyRequestV1'
      responses:
        '201':
          description: Created proxy and generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyMutationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/proxies/{name}:
    get:
      operationId: getProxy
      summary: Get a stream proxy
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      responses:
        '200':
          description: Stream proxy view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeProxyViewV1'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchProxy
      summary: Update a stream proxy
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeProxyPatchV1'
      responses:
        '200':
          description: Updated proxy and generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyMutationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteProxy
      summary: Delete a stream proxy
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      responses:
        '200':
          description: Deletion receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/proxies/{name}/faults:
    get:
      operationId: listFaults
      summary: List stream faults by direction
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      responses:
        '200':
          description: Faults by direction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionalFaultLists'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addFault
      summary: Add a stream fault
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultUpsertV1'
      responses:
        '201':
          description: Created fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultMutationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/proxies/{name}/faults/{id}:
    get:
      operationId: getFault
      summary: Get a stream fault
      parameters:
        - $ref: '#/components/parameters/ProxyName'
        - $ref: '#/components/parameters/FaultId'
      responses:
        '200':
          description: Fault with direction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultMutationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchFault
      summary: Update a stream fault
      parameters:
        - $ref: '#/components/parameters/ProxyName'
        - $ref: '#/components/parameters/FaultId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultPatchV1'
      responses:
        '200':
          description: Updated fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultMutationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteFault
      summary: Remove a stream fault
      parameters:
        - $ref: '#/components/parameters/ProxyName'
        - $ref: '#/components/parameters/FaultId'
      responses:
        '200':
          description: Deletion receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/connections:
    get:
      operationId: listConnections
      summary: List active stream connections
      responses:
        '200':
          description: Active connection snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionSnapshot'
  /v1/connections/{id}:
    get:
      operationId: getConnection
      summary: Get an active stream connection
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Connection snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionSnapshot'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: killConnection
      summary: Terminate an active stream connection
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Termination receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTerminationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/history:
    get:
      operationId: getHistory
      summary: List retained closed-connection evidence
      responses:
        '200':
          description: Closed-connection records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClosedConnection'
  /v1/scenarios/apply:
    post:
      operationId: applyScenario
      summary: Apply a Scenario V1 document or Scenario V2 schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ScenarioV1'
                - $ref: '#/components/schemas/ScenarioScheduleV2Dto'
              discriminator:
                propertyName: version
                mapping:
                  '1': '#/components/schemas/ScenarioV1'
                  '2': '#/components/schemas/ScenarioScheduleV2Dto'
      responses:
        '202':
          description: Accepted run record (V1 or V2 shape).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ScenarioRunV1'
                  - $ref: '#/components/schemas/ScheduleRunV2'
        '400':
          $ref: '#/components/responses/Invalid'
  /v1/scenarios/validate:
    post:
      operationId: validateSchedule
      summary: Validate a Scenario V2 schedule without creating a run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioScheduleV2Dto'
      responses:
        '200':
          description: Validation report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleValidateV2'
        '400':
          $ref: '#/components/responses/Invalid'
  /v1/scenarios/compile:
    post:
      operationId: compileSchedule
      summary: Compile a Scenario V2 schedule without creating a run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioScheduleV2Dto'
      responses:
        '200':
          description: Compiled event tape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleCompileV2'
        '400':
          $ref: '#/components/responses/Invalid'
  /v1/scenarios/{id}:
    get:
      operationId: getScenario
      summary: Get a Scenario V1 or V2 run record
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: Run record (V1 or V2 shape).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ScenarioRunV1'
                  - $ref: '#/components/schemas/ScheduleRunV2'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelScenario
      summary: Cancel a Scenario V1 or V2 run
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: Cancelled run record (V1 or V2 shape).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ScenarioRunV1'
                  - $ref: '#/components/schemas/ScheduleRunV2'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/datagram-proxies:
    get:
      operationId: listDatagramProxies
      summary: List datagram proxies
      responses:
        '200':
          description: Datagram proxy views.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NativeDatagramProxyViewV1'
    post:
      operationId: createDatagramProxy
      summary: Create a datagram proxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeDatagramProxyRequestV1'
      responses:
        '201':
          description: Created datagram proxy and generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatagramProxyMutationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/datagram-proxies/{name}:
    get:
      operationId: getDatagramProxy
      summary: Get a datagram proxy
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      responses:
        '200':
          description: Datagram proxy view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeDatagramProxyViewV1'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchDatagramProxy
      summary: Update a datagram proxy
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeDatagramProxyPatchV1'
      responses:
        '200':
          description: Updated datagram proxy and generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatagramProxyMutationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteDatagramProxy
      summary: Delete a datagram proxy
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      responses:
        '200':
          description: Deletion receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/datagram-proxies/{name}/faults:
    get:
      operationId: listDatagramFaults
      summary: List datagram faults by direction
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      responses:
        '200':
          description: Datagram faults by direction with generations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionalDatagramFaultLists'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addDatagramFault
      summary: Add a datagram fault
      parameters:
        - $ref: '#/components/parameters/ProxyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatagramFaultUpsertV1'
      responses:
        '201':
          description: Created datagram fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatagramFaultMutationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/datagram-proxies/{name}/faults/{id}:
    get:
      operationId: getDatagramFault
      summary: Get a datagram fault
      parameters:
        - $ref: '#/components/parameters/ProxyName'
        - $ref: '#/components/parameters/FaultId'
      responses:
        '200':
          description: Datagram fault with direction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatagramFaultMutationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchDatagramFault
      summary: Update a datagram fault
      parameters:
        - $ref: '#/components/parameters/ProxyName'
        - $ref: '#/components/parameters/FaultId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatagramFaultPatchV1'
      responses:
        '200':
          description: Updated datagram fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatagramFaultMutationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteDatagramFault
      summary: Remove a datagram fault
      parameters:
        - $ref: '#/components/parameters/ProxyName'
        - $ref: '#/components/parameters/FaultId'
      responses:
        '200':
          description: Deletion receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/datagram-associations:
    get:
      operationId: listDatagramAssociations
      summary: List datagram associations
      responses:
        '200':
          description: Datagram association views.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NativeDatagramAssociationViewV1'
  /v1/datagram-associations/{id}:
    get:
      operationId: getDatagramAssociation
      summary: Get a datagram association
      parameters:
        - $ref: '#/components/parameters/AssociationId'
      responses:
        '200':
          description: Datagram association view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeDatagramAssociationViewV1'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: killDatagramAssociation
      summary: Terminate a datagram association
      parameters:
        - $ref: '#/components/parameters/AssociationId'
      responses:
        '200':
          description: Termination receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatagramAssociationTerminationResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Required on every operation when the admin listener is configured
        with a bearer token (mandatory for non-loopback listeners).
        Loopback listeners without a configured token accept
        unauthenticated requests. Tokens travel only in the
        `Authorization: Bearer <token>` header and never appear in
        bodies, logs, or error output.
  parameters:
    ProxyName:
      name: name
      in: path
      required: true
      description: Proxy name (`[A-Za-z0-9._-]+`, 1..=128 bytes).
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
        minLength: 1
        maxLength: 128
    FaultId:
      name: id
      in: path
      required: true
      description: Fault identity (URL-encoded; decoded exactly once).
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ConnectionId:
      name: id
      in: path
      required: true
      description: Numeric connection identifier.
      schema:
        type: integer
        format: uint64
        minimum: 0
    ScenarioId:
      name: id
      in: path
      required: true
      description: Numeric scenario run identifier.
      schema:
        type: integer
        format: uint64
        minimum: 0
    AssociationId:
      name: id
      in: path
      required: true
      description: Numeric datagram association identifier.
      schema:
        type: integer
        format: uint64
        minimum: 0
  responses:
    Invalid:
      description: Validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeV1'
    NotFound:
      description: Missing resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeV1'
    Conflict:
      description: Generation conflict or duplicate identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeV1'
  schemas:
    ErrorEnvelopeV1:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine code.
              enum: [not_found, conflict, invalid, invalid_json, unauthorized, bind_failed, restart_failed, serialization]
            message:
              type: string
              description: Bounded human detail; never echoes bearer tokens.
    HealthV1:
      type: object
      required: [running, generation]
      additionalProperties: false
      properties:
        running:
          type: boolean
        generation:
          type: integer
          format: uint64
          minimum: 0
    VersionV1:
      type: object
      required: [version, api]
      additionalProperties: false
      properties:
        version:
          type: string
        api:
          type: string
          enum: ['v1']
    Direction:
      type: string
      enum: [upstream, downstream]
    RngVersion:
      type: string
      enum: [V1]
    NativeProxyRequestV1:
      type: object
      required: [name, listen, upstream]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._-]+$'
        listen:
          $ref: '#/components/schemas/SocketAddr'
        upstream:
          $ref: '#/components/schemas/SocketAddr'
        enabled:
          type: boolean
          default: true
        max_connections:
          type: integer
          format: uint64
          minimum: 1
          nullable: true
        connect_timeout_ms:
          type: integer
          format: uint64
          minimum: 1
          maximum: 300000
          default: 5000
        seed:
          type: integer
          format: uint64
          default: 0
    NativeProxyPatchV1:
      type: object
      additionalProperties: false
      properties:
        listen:
          $ref: '#/components/schemas/SocketAddr'
        upstream:
          $ref: '#/components/schemas/SocketAddr'
        enabled:
          type: boolean
        max_connections:
          type: integer
          format: uint64
          minimum: 1
          nullable: true
        connect_timeout_ms:
          type: integer
          format: uint64
          minimum: 1
          maximum: 300000
    StreamFaultKind:
      oneOf:
        - $ref: '#/components/schemas/StreamFaultLatency'
        - $ref: '#/components/schemas/StreamFaultBandwidth'
        - $ref: '#/components/schemas/StreamFaultBlackhole'
        - $ref: '#/components/schemas/StreamFaultLimitData'
        - $ref: '#/components/schemas/StreamFaultSlowClose'
        - $ref: '#/components/schemas/StreamFaultSlice'
        - $ref: '#/components/schemas/StreamFaultDisconnect'
      discriminator:
        propertyName: type
        mapping:
          latency: '#/components/schemas/StreamFaultLatency'
          bandwidth: '#/components/schemas/StreamFaultBandwidth'
          blackhole: '#/components/schemas/StreamFaultBlackhole'
          limit-data: '#/components/schemas/StreamFaultLimitData'
          slow-close: '#/components/schemas/StreamFaultSlowClose'
          slice: '#/components/schemas/StreamFaultSlice'
          disconnect: '#/components/schemas/StreamFaultDisconnect'
    StreamFaultLatency:
      type: object
      required: [type, delay_ns]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [latency]
        delay_ns:
          type: integer
          format: uint64
          minimum: 0
        jitter_ns:
          type: integer
          format: uint64
          minimum: 0
          default: 0
        max_buffer_bytes:
          type: integer
          format: uint64
          minimum: 1
          maximum: 67108864
          default: 65536
    StreamFaultBandwidth:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [bandwidth]
        bytes_per_second:
          type: integer
          format: uint64
          minimum: 1
          default: 1
        burst_bytes:
          type: integer
          format: uint64
          minimum: 1
          default: 65536
    StreamFaultBlackhole:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [blackhole]
        close_after_ns:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
    StreamFaultLimitData:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [limit-data]
        bytes:
          type: integer
          format: uint64
          minimum: 1
          default: 1
    StreamFaultSlowClose:
      type: object
      required: [type, delay_ns]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [slow-close]
        delay_ns:
          type: integer
          format: uint64
          minimum: 0
    StreamFaultSlice:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [slice]
        average_size:
          type: integer
          format: uint64
          minimum: 1
          default: 1024
        variation:
          type: integer
          format: uint64
          minimum: 0
          default: 0
        delay_ns:
          type: integer
          format: uint64
          minimum: 0
          default: 0
    StreamFaultDisconnect:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [disconnect]
        after_ns:
          type: integer
          format: uint64
