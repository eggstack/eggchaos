name: Release qualification

# M059: least-privilege default. Artifact upload uses the ephemeral
# runtime token, so `contents: read` is sufficient; no job pushes
# commits or publishes packages. Publication (M058) is a separate
# owner-controlled action taken from a tagged candidate.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  # M056 release-contract gate: one cheap prerequisite job that runs the
  # M055 tag/package-version guard and no expensive tooling. Both
  # expensive branches (`qualify` and the five-target `artifacts` matrix)
  # declare this job as a hard `needs:` dependency, so a mismatched tag
  # fails here and neither downstream job may start. On `workflow_dispatch`
  # the guard skips the tag comparison but still runs ordinary manifest
  # coherence, keeping manual qualification usable without a tag.
  release-contract:
    # Guard is stdlib Python + POSIX sh only (manifest parse + tag
    # string check). The whole job completes in seconds; a 5-minute
    # bound leaves comfortable slack without absorbing any expensive
    # step. Do not install cargo / cargo-audit / cargo-deny / cargo-fuzz
    # / cross linkers here — they belong in the downstream jobs.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No authenticated Git operation follows checkout in any
          # job, so do not persist the token in the local git config.
          persist-credentials: false
      # M055 tag/package version agreement: tag runs require
      # `tag minus leading v == workspace version`; dispatch runs
      # require manifest coherence. No tag creation or publication.
      - run: ./scripts/check_release_tag_version.sh
  qualify:
    # Bounded for the same reason as CI: fuzz/toxiproxy/eggfetch
    # qualification must fail loudly, never park a runner for hours.
    timeout-minutes: 60
    env:
      RUST_TEST_THREADS: 4
    needs: [release-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No authenticated Git operation follows checkout in any
          # job, so do not persist the token in the local git config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master 2026-10-01)
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      # M056: the tag/version contract is owned exclusively by the
      # `release-contract` prerequisite job above. Re-running the guard
      # here would create a second scheduling authority that could
      # silently drift from the shared gate, defeating the corrective.
      # cargo-fuzz 0.13.2's transitive cargo-platform@0.3.3 requires rustc
      # 1.91 to compile, so it cannot be built by the pinned 1.89.0 MSRV
      # toolchain (observed: exit 101 in CI). Build the cargo-fuzz binary
      # itself with current stable; the fuzz target it drives still builds
      # and runs under the pinned 1.89.0 toolchain (--sanitizer none needs
      # no nightly features, as proven by local MSRV runs).
      - run: rustup toolchain install stable --profile minimal
      - run: RUSTUP_TOOLCHAIN=stable cargo install cargo-fuzz --locked --version 0.13.2
      - run: ./scripts/release-smoke.sh
      - run: ./scripts/benchmark_datagram.sh
      - run: EGGCHAOS_FUZZ_RUNS=10000 ./scripts/qualify_fuzz.sh
      - name: Acquire checksum-pinned Toxiproxy v2.12.0 oracle
        shell: bash
        run: echo "TOXIPROXY_SERVER=$(./scripts/fetch_toxiproxy_v2_12.sh)" >> "$GITHUB_ENV"
      - run: EGGCHAOS_REQUIRE_TOXIPROXY_ORACLE=1 ./scripts/qualify_toxiproxy_v2_12.sh
      - run: ./scripts/qualify_eggfetch.sh
      - run: ./scripts/release-artifact-smoke.sh

  artifacts:
    # Release builds (notably Windows) must also fail loudly, never
    # occupy a runner indefinitely.
    timeout-minutes: 45
    # M059: attestation/OIDC scopes live only on this job, never on the
    # whole workflow. `contents: read` is restated because a job-level
    # block replaces the workflow default.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # The aarch64 Linux cross build must use the cross linker installed
    # below; the host /usr/bin/ld cannot link aarch64 objects (observed:
    # "file in wrong format"). macOS x86_64 builds cross-compile from an
    # ARM64 host (macos-13 Intel runners are retired); rustc + Xcode clang
    # handle -arch x86_64 for the --target build.
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    # M056: the artifact matrix must not start unless the
    # `release-contract` gate has succeeded, so an invalid tag cannot
    # spawn cross-build runners and upload binaries named from it.
    needs: [release-contract]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No authenticated Git operation follows checkout in any
          # job, so do not persist the token in the local git config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master 2026-10-01)
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - name: Install Linux ARM linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --package eggchaos-cli --target "${{ matrix.target }}"
      - name: Package and checksum artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${{ matrix.os }}" == windows-* ]]; then suffix=".exe"; fi
          source="target/${{ matrix.target }}/release/eggchaos${suffix}"
          artifact="eggchaos-v${GITHUB_REF_NAME#v}-${{ matrix.target }}${suffix}"
          cp "$source" "$artifact"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$artifact" > "$artifact.sha256"
          else
            shasum -a 256 "$artifact" > "$artifact.sha256"
          fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      # M059: Sigstore provenance for the exact binary built above. The
      # SHA-256 sidecar contract is unchanged and remains the primary
      # checksum; attestation is additional provenance, never a
      # substitute for checksum validation.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.artifact }}
      # M059: hosted verification of one native-host binary through
      # GitHub's attestation verification path.
      - name: Verify attestation (native-host leg only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "${{ steps.package.outputs.artifact }}" --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eggchaos-${{ matrix.target }}
          path: |
            eggchaos-*
