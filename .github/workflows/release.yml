name: Release qualification

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  qualify:
    # Bounded for the same reason as CI: fuzz/toxiproxy/eggfetch
    # qualification must fail loudly, never park a runner for hours.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      # cargo-fuzz 0.13.2's transitive cargo-platform@0.3.3 requires rustc
      # 1.91 to compile, so it cannot be built by the pinned 1.89.0 MSRV
      # toolchain (observed: exit 101 in CI). Build the cargo-fuzz binary
      # itself with current stable; the fuzz target it drives still builds
      # and runs under the pinned 1.89.0 toolchain (--sanitizer none needs
      # no nightly features, as proven by local MSRV runs).
      - run: rustup toolchain install stable --profile minimal
      - run: RUSTUP_TOOLCHAIN=stable cargo install cargo-fuzz --locked --version 0.13.2
      - run: ./scripts/release-smoke.sh
      - run: EGGCHAOS_FUZZ_RUNS=10000 ./scripts/qualify_fuzz.sh
      - run: ./scripts/qualify_toxiproxy_v2_12.sh
      - run: ./scripts/qualify_eggfetch.sh
      - run: ./scripts/release-artifact-smoke.sh

  artifacts:
    # Release builds (notably Windows) must also fail loudly, never
    # occupy a runner indefinitely.
    timeout-minutes: 45
    # The aarch64 Linux cross build must use the cross linker installed
    # below; the host /usr/bin/ld cannot link aarch64 objects (observed:
    # "file in wrong format"). macOS x86_64 builds cross-compile from an
    # ARM64 host (macos-13 Intel runners are retired); rustc + Xcode clang
    # handle -arch x86_64 for the --target build.
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - name: Install Linux ARM linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --package eggchaos-cli --target "${{ matrix.target }}"
      - name: Package and checksum artifact
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${{ matrix.os }}" == windows-* ]]; then suffix=".exe"; fi
          source="target/${{ matrix.target }}/release/eggchaos${suffix}"
          artifact="eggchaos-v${GITHUB_REF_NAME#v}-${{ matrix.target }}${suffix}"
          cp "$source" "$artifact"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$artifact" > "$artifact.sha256"
          else
            shasum -a 256 "$artifact" > "$artifact.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eggchaos-${{ matrix.target }}
          path: |
            eggchaos-*
