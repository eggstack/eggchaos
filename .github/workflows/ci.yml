name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Hard bound: one stuck test once burned 4+ hours per platform on every
    # push (cargo runs test binaries serially). No job may burn a runner
    # longer than this; the suite completes in minutes when healthy.
    timeout-minutes: 25
    env:
      # Keep async socket-heavy tests below the per-process descriptor limits
      # on developer and hosted runners while still exercising concurrency.
      RUST_TEST_THREADS: 4
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Run IPv6 datagram loopback qualification with visible capability result
        run: cargo test -p eggchaos-server --all-features runtime::datagram::tests::ipv6_loopback_works_when_host_capability_is_available -- --exact --nocapture
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories licenses bans sources
