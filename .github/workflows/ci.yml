name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Hard bound: one stuck test once burned 4+ hours per platform on every
    # push (cargo runs test binaries serially). No job may burn a runner
    # longer than this; the suite completes in minutes when healthy.
    timeout-minutes: 25
    env:
      # Keep async socket-heavy tests below the per-process descriptor limits
      # on developer and hosted runners while still exercising concurrency.
      RUST_TEST_THREADS: 4
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Run IPv6 datagram loopback qualification with visible capability result
        run: cargo test -p eggchaos-server --all-features runtime::datagram::tests::ipv6_loopback_works_when_host_capability_is_available -- --exact --nocapture
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories licenses bans sources
  language-clients:
    # M033 native-control SDKs: derivation drift + unit gates + real-server
    # cross-language qualification + package artifact builds (no publication).
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        node-version: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: pip install build pytest pyyaml
      - run: sh scripts/tests/test_cleanup_traps.sh
      - run: sh scripts/tests/test_fetch_toxiproxy_post_v2_12_contract.sh
      - run: ./scripts/check_openapi.sh
      - run: ./scripts/check_python_client.sh
      - run: ./scripts/check_typescript_client.sh
      - run: ./scripts/qualify_language_clients.sh
  python-native:
    # M035 hosted native-Python gate: safe facade + binding audit/build +
    # abi3 import/runtime smoke + remote/native conformance on
    # native-host wheels. Kept separate so Rust and remote-SDK gates stay
    # independent of Python packaging availability.
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install maturin==1.9.5 pytest build
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: ./scripts/check_python_native.sh
      - run: ./scripts/qualify_python_native.sh
