name: CI

# M059: least-privilege default. No job publishes releases, pushes
# commits, or writes packages; attestations are not used in CI.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  check:
    # Hard bound: one stuck test once burned 4+ hours per platform on every
    # push (cargo runs test binaries serially). No job may burn a runner
    # longer than this; the suite completes in minutes when healthy.
    timeout-minutes: 25
    env:
      # Keep async socket-heavy tests below the per-process descriptor limits
      # on developer and hosted runners while still exercising concurrency.
      RUST_TEST_THREADS: 4
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No authenticated Git operation follows checkout in any
          # job, so do not persist the token in the local git config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master 2026-10-01)
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      # M048 Tier A: cheap M047 Git-state provenance contract on Linux and
      # macOS only. POSIX `sh` script; Windows runner is intentionally
      # skipped (M048 must not claim Windows POSIX-shell coverage).
      - name: "M048 Tier A: bench provenance Git-state contract"
        if: runner.os != 'Windows'
        run: sh scripts/tests/test_bench_provenance.sh
      # M055 release tag/version agreement guard: cheap POSIX sh +
      # stdlib Python structural/behavioral contract on Linux and macOS
      # only (same Windows gate as the M048 Tier A POSIX script).
      - name: "M055: release tag/version agreement guard"
        if: runner.os != 'Windows'
        run: sh scripts/tests/test_release_tag_version.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Run IPv6 datagram loopback qualification with visible capability result
        run: cargo test -p eggchaos-server --all-features runtime::datagram::tests::ipv6_loopback_works_when_host_capability_is_available -- --exact --nocapture
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories licenses bans sources
  performance-provenance:
    # M048 Tier B: shortened M047 artifact-level stream/probe/datagram
    # qualification on Linux only. Reuses the existing benchmarks cache
    # via Swatinem/rust-cache so cold release builds are one-shot per
    # branch; tightened 12-minute bound (under the 25-minute check bound)
    # keeps the dedicated job well below the global CI timeout. Schema/
    # wrapper qualification only — no throughput-value assertions.
    timeout-minutes: 12
    env:
      RUST_TEST_THREADS: 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No authenticated Git operation follows checkout in any
          # job, so do not persist the token in the local git config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master 2026-10-01)
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: "M048 Tier B: bench provenance artifact qualification"
        run: sh scripts/tests/test_bench_provenance_artifacts.sh
  language-clients:
    # M033 native-control SDKs: derivation drift + unit gates + real-server
    # cross-language qualification + package artifact builds (no publication).
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        node-version: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No authenticated Git operation follows checkout in any
          # job, so do not persist the token in the local git config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master 2026-10-01)
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      # M059: exact-version CI tooling. The constraint file owns the
      # tested graph; Dependabot proposes updates.
      - run: pip install -r .github/python-ci/requirements.txt
      - run: sh scripts/tests/test_cleanup_traps.sh
      - run: sh scripts/tests/test_fetch_toxiproxy_post_v2_12_contract.sh
      # M048 WP6: structural guard against accidental CI de-integration of
      # the M047 provenance tests. Lives in language-clients (not in
      # check or the dedicated provenance job itself) so a regression in
      # those jobs still triggers this independent check.
      - run: sh scripts/tests/test_ci_provenance_integration.sh
      # M053: structural guard against removing the cheap planning-state
      # drift check from `check`. Runs here (not in `check` itself) so a
      # regression in the local check still triggers this independent
      # check. Python stdlib only, well under one second on normal
      # hardware.
      - run: python3 scripts/check_planning_state.py --check
      # M055: version-coherence guard against manifest/tag drift.
      # Runs here (not in `check` itself) so removing the local check
      # still trips this independent check. Python stdlib only, well
      # under one second on normal hardware.
      - run: python3 scripts/check_version_coherence.py --check
      # M059: workspace lint-inheritance guard against a future member
      # omitting `[lints] workspace = true`. Runs here (not in `check`
      # itself) so removing the local check still trips this
      # independent check. Python stdlib only, well under one second
      # on normal hardware.
      - run: python3 scripts/check_lint_inheritance.py --check
      # M059: first-party lockfile-coherence guard against drift
      # between the four committed Cargo lockfiles. Runs here (not in
      # `check` itself) so removing the local check still trips this
      # independent check. Python stdlib only, well under one second
      # on normal hardware.
      - run: python3 scripts/check_lock_coherence.py --check
      # M059: immutable-action / least-privilege guard against moving
      # action tags and missing permission scopes. Runs here (not in
      # `check` itself) so removing the local check still trips this
      # independent check. Python stdlib only, well under one second
      # on normal hardware.
      - run: python3 scripts/check_action_pins.py --check
      - run: ./scripts/check_openapi.sh
      - run: ./scripts/check_python_client.sh
      - run: ./scripts/check_typescript_client.sh
      - run: ./scripts/qualify_language_clients.sh
  python-native:
    # M035 hosted native-Python gate: safe facade + binding audit/build +
    # abi3 import/runtime smoke + remote/native conformance on
    # native-host wheels. Kept separate so Rust and remote-SDK gates stay
    # independent of Python packaging availability.
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No authenticated Git operation follows checkout in any
          # job, so do not persist the token in the local git config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master 2026-10-01)
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # M059: exact-version CI tooling (maturin held at its qualified
      # 1.9.5; see .github/python-ci/requirements.txt).
      - run: pip install -r .github/python-ci/requirements.txt
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: ./scripts/check_python_native.sh
      - run: ./scripts/qualify_python_native.sh
  api-gate:
    # M059 Rust public-API regression gate: zero drift vs the M059
    # activation snapshot plus the pinned M057 census (see
    # scripts/qualify_rust_api.sh). Runs on a current stable toolchain,
    # never the 1.89 MSRV compiler. Full history is required: the tool
    # compares against the M057 and activation revisions.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: semver baselines are git revisions.
          fetch-depth: 0
          # No authenticated Git operation follows checkout.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master 2026-10-01)
        with:
          toolchain: stable
      - run: cargo install cargo-semver-checks --locked --version 0.50.0
      - run: ./scripts/qualify_rust_api.sh
