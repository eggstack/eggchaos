name: Dependency review

# M059: PR dependency review with an explicit vulnerability failure
# threshold. License authority stays in cargo-deny (deny.toml); this
# workflow carries no license allow-list to avoid a second authority.
permissions:
  contents: read

on:
  pull_request:

jobs:
  review:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
