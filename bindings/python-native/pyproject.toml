[build-system]
requires = ["maturin==1.9.5"]
build-backend = "maturin"

[project]
name = "eggchaos-native"
version = "0.1.0"
description = "Native in-process embedding pilot for eggchaos (PyO3 over eggchaos-embed)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eggstack" }]
keywords = ["chaos", "fault-injection", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/eggstack/eggchaos"

[tool.maturin]
bindings = "pyo3"
module-name = "eggchaos_native"
python-source = "python"
features = ["pyo3/extension-module"]
