# Standalone maturin crate: plain cargo cannot link a macOS
# extension-module cdylib, so this crate stands outside the workspace
# (maturin owns the link step). Path dependencies still resolve to the
# local crates; versions match the workspace release for future
# publication bookkeeping.
[workspace]

[package]
name = "eggchaos-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eggstack/eggchaos"
description = "PyO3 native embedding pilot for eggchaos (managed Service over eggchaos-embed)"

[lib]
name = "eggchaos_native"
crate-type = ["cdylib"]

[dependencies]
eggchaos-embed = { path = "../../crates/eggchaos-embed", version = "0.1.0" }
eggchaos-protocol = { path = "../../crates/eggchaos-protocol", version = "0.1.0" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
