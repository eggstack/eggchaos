[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "eggchaos-client"
version = "0.1.0"
description = "Native control client for eggchaos (/v1, derived from the M032 OpenAPI contract)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eggstack" }]
keywords = ["chaos", "fault-injection", "testing", "toxiproxy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/eggstack/eggchaos"

[tool.setuptools.packages.find]
where = ["."]
include = ["eggchaos_client*"]
