[package]
name = "eggchaos-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
eggchaos-core = { path = "../crates/eggchaos-core" }
eggchaos-server = { path = "../crates/eggchaos-server" }
eggchaos-toxiproxy = { path = "../crates/eggchaos-toxiproxy" }
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["time"] }

[[bin]]
name = "plan_json"
path = "fuzz_targets/plan_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datagram_plan_json"
path = "fuzz_targets/datagram_plan_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datagram_transitions"
path = "fuzz_targets/datagram_transitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_config"
path = "fuzz_targets/native_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_control_json"
path = "fuzz_targets/native_control_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fault_evidence_json"
path = "fuzz_targets/fault_evidence_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_transitions"
path = "fuzz_targets/policy_transitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "toxiproxy_attributes"
path = "fuzz_targets/toxiproxy_attributes.rs"
test = false
doc = false
bench = false

[workspace]
