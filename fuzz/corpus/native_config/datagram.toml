version = 1

[runtime.datagram]
max_proxies = 16
max_associations = 512
history = 100
ingress_per_association = 16
max_ingress_queue_bytes = 1048576

[[datagram_proxies]]
name = "dns"
listen = "127.0.0.1:0"
upstream = "127.0.0.1:5353"
max_associations = 32
association_idle_timeout_ms = 60000
max_datagram_size = 65507
max_queued_datagrams = 64
max_queued_bytes = 262144
seed = 7

upstream_faults = [{ id = "delay", probability = 0.5, kind = { type = "delay", delay_ns = 1000, jitter_ns = 250 } }]
downstream_faults = [{ id = "loss", probability = 0.01, kind = { type = "loss" } }]
