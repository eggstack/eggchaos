version = 2
seed = 7
execution_key = 11
isolation = "strict"
cleanup = "restore-initial"

[[phases]]
name = "warmup"
duration_ns = 1000000000

[[phases.actions]]
type = "set-plan"
proxy = "cache"
direction = "downstream"

[[phases.actions.faults]]
id = "delay"
probability = 1.0

[phases.actions.faults.kind]
type = "latency"
delay_ns = 5000000
jitter_ns = 0
max_buffer_bytes = 1024
